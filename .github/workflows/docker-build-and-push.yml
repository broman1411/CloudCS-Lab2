name: CI/CD - Test, Build and Push to DockerHub

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKER_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
  REPO_NAME: ${{ secrets.DOCKERHUB_REPO }}

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.13" ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pycodestyle pytest
      
      - name: Lint with pycodestyle
        run: |
          pycodestyle src test --max-line-length=100 || true
      
      - name: Test with pytest
        run: |
          PYTHONPATH=./:./src pytest test/test_model_utils.py -v
        env:
          MODEL_PATH: /tmp/test_model.pkl

  push-to-docker-hub:
    needs: tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      
      - name: Build and push Keycloak image
        uses: docker/build-push-action@v6
        with:
          context: ./keycloak/docker
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.REPO_NAME }}:keycloak
            ${{ env.DOCKER_USER }}/${{ env.REPO_NAME }}:keycloak-${{ github.sha }}
      
      - name: Build and push Inference Service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_USER }}/${{ env.REPO_NAME }}:inference-service
            ${{ env.DOCKER_USER }}/${{ env.REPO_NAME }}:inference-service-${{ github.sha }}
